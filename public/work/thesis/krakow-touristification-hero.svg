<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="district-phases-title district-phases-desc">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .title { font-weight: 700; font-size: 28px; fill: #111111; letter-spacing: -0.02em; }
      .badge-label { font-weight: 700; font-size: 13px; fill: #2352c5; letter-spacing: 0.12em; }
      .axis-label { font-weight: 600; font-size: 13px; fill: #666666; letter-spacing: 0.1em; }
      .district-name { font-weight: 700; font-size: 26px; fill: #111111; letter-spacing: -0.01em; }
      .district-sub { font-weight: 500; font-size: 14.5px; fill: #666666; letter-spacing: 0.02em; }
    </style>
    <marker id="phase-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" stroke="#111111" stroke-width="1.5" fill="none" />
    </marker>
    <marker id="phase-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#2352c5" stroke-width="1.5" />
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#f4f4f5" />
  <title id="district-phases-title">Three Kraków districts positioned by perceived cost of tourism</title>
  <desc id="district-phases-desc">Podgórze sits at 3.21 on the cost index, well to the left. Old Town at 3.84 and Kazimierz at 3.86 sit almost on top of each other at the right. A dashed arrow runs from Podgórze towards them, marking the trajectory its residents expect to follow.</desc>

  <text x="110" y="68" class="title">Three districts, one process</text>

  <!-- Trajectory -->
  <g>
    <path d="M 258.7 258 L 723.4 258" stroke="#2352c5" stroke-width="1.5" stroke-dasharray="4 7" marker-end="url(#phase-arrow-accent)" fill="none" />
    <text x="491" y="242" class="badge-label" text-anchor="middle">ANTICIPATED TRAJECTORY</text>
  </g>

  <!-- Axis -->
  <line x1="110" y1="300" x2="900" y2="300" marker-end="url(#phase-arrow)" stroke="#111111" stroke-width="1.5" />
  <text x="900" y="334" text-anchor="end" class="axis-label">PERCEIVED COST OF TOURISM (INDEX 1-5)</text>

  <!-- Podgórze -->
  <g>
    <line x1="212.2" y1="300" x2="212.2" y2="200" stroke="#d4d4d8" stroke-width="1" />
    <circle cx="212.2" cy="300" r="7" fill="#2352c5" />
    <text x="212.2" y="160" text-anchor="middle" class="district-name" fill="#2352c5">Podgórze</text>
    <text x="212.2" y="186" text-anchor="middle" class="district-sub">Being drawn in · n = 144 · 3.21</text>
  </g>

  <!-- Old Town -->
  <g>
    <line x1="797.8" y1="300" x2="797.8" y2="150" stroke="#d4d4d8" stroke-width="1" />
    <circle cx="797.8" cy="300" r="7" fill="#111111" />
    <text x="797.8" y="110" text-anchor="middle" class="district-name">Old Town</text>
    <text x="797.8" y="136" text-anchor="middle" class="district-sub">Mature touristification · n = 156 · 3.84</text>
  </g>

  <!-- Kazimierz -->
  <g>
    <line x1="816.4" y1="300" x2="816.4" y2="380" stroke="#d4d4d8" stroke-width="1" />
    <circle cx="816.4" cy="300" r="7" fill="#111111" />
    <text x="816.4" y="410" text-anchor="middle" class="district-name">Kazimierz</text>
    <text x="816.4" y="436" text-anchor="middle" class="district-sub">Rapid, rental- and nightlife-driven · n = 146 · 3.86</text>
  </g>
</svg>