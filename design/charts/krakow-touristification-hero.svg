  <title>Three districts chosen as three phases of one process, positioned here by the cost index their residents actually reported. Old Town and Kazimierz land on top of each other; Podgórze sits apart, and expects to follow.</title>
  <rect width="1000" height="470" fill="#ededed" /><title id="district-phases-title">Three Kraków districts positioned by perceived cost of tourism</title><desc id="district-phases-desc">Podgórze sits at 3.21 on the cost index, well to the left. Old Town at 3.84 and Kazimierz at 3.86 sit almost on top of each other at the right. A dashed arrow runs from Podgórze towards them, marking the trajectory its residents expect to follow.</desc><text x="110" y="68" font-family="Druk Wide" font-size="28px" letter-spacing="0.005em" fill="#191714">Three districts, one process</text><g><path d="M 258.7058823529409 258 L 723.411764705882 258" stroke-dasharray="4 7" marker-end="url(#phase-arrow-accent)"></path><text x="491.0588235294114" y="242" font-family="Noirden" font-size="14px" letter-spacing=".12em" fill="#2352c5" text-anchor="middle">ANTICIPATED TRAJECTORY</text></g><line x1="110" y1="300" x2="900" y2="300" marker-end="url(#phase-arrow)" stroke="#191714" stroke-width="1.5"></line><text x="900" y="334" text-anchor="end" font-family="Noirden" font-size="14px" letter-spacing=".12em" fill="#595653">PERCEIVED COST OF TOURISM (INDEX 1–5)</text><g><line x1="212.23529411764693" y1="300" x2="212.23529411764693" y2="200" stroke="#d4d4d4" stroke-width="1"></line><circle cx="212.23529411764693" cy="300" r="7" fill="#191714"></circle><text x="212.23529411764693" y="160" text-anchor="middle" font-family="Noirden" font-size="26px" font-weight="800" letter-spacing="-.01em" fill="#191714">Podgórze</text><text x="212.23529411764693" y="186" text-anchor="middle" font-family="Noirden" font-size="15px" letter-spacing=".05em" fill="#595653">Being drawn in<!-- --> · n = <!-- -->144<!-- --> · <!-- -->3.21</text></g><g><line x1="797.7647058823527" y1="300" x2="797.7647058823527" y2="150" stroke="#d4d4d4" stroke-width="1"></line><circle cx="797.7647058823527" cy="300" r="7" fill="#191714"></circle><text x="797.7647058823527" y="110" text-anchor="middle" font-family="Noirden" font-size="26px" font-weight="800" letter-spacing="-.01em" fill="#191714">Old Town</text><text x="797.7647058823527" y="136" text-anchor="middle" font-family="Noirden" font-size="15px" letter-spacing=".05em" fill="#595653">Mature touristification<!-- --> · n = <!-- -->156<!-- --> · <!-- -->3.84</text></g><g><line x1="816.3529411764704" y1="300" x2="816.3529411764704" y2="380" stroke="#d4d4d4" stroke-width="1"></line><circle cx="816.3529411764704" cy="300" r="7" fill="#191714"></circle><text x="816.3529411764704" y="410" text-anchor="middle" font-family="Noirden" font-size="26px" font-weight="800" letter-spacing="-.01em" fill="#191714">Kazimierz</text><text x="816.3529411764704" y="436" text-anchor="middle" font-family="Noirden" font-size="15px" letter-spacing=".05em" fill="#595653">Rapid, rental- and nightlife-driven<!-- --> · n = <!-- -->146<!-- --> · <!-- -->3.86</text></g><defs><marker id="phase-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" stroke="#191714" stroke-width="1.5" fill="none"></path></marker><marker id="phase-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#2352c5" stroke-width="1.5"></path></marker></defs></svg>
